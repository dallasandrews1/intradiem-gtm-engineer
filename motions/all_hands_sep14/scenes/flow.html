<!doctype html><html><head><meta charset="utf-8"><title>Every source, one engine</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--forest:#014637;--green:#2DB56E;--green-300:#7BD3A0;--orange:#F58220}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:var(--forest);color:#fff;font-family:Roboto,'Helvetica Neue',Arial,sans-serif;position:relative}
body::after{content:"";position:absolute;right:-300px;top:-280px;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(45,181,110,.28),transparent 62%);pointer-events:none}
.wrap{position:absolute;inset:0;padding:64px 110px 90px;z-index:1;display:flex;flex-direction:column}
.logo{height:40px;width:163px;color:#fff;display:block;margin-bottom:30px}
.eye{font-family:'Roboto Mono',Menlo,monospace;text-transform:uppercase;letter-spacing:.18em;font-size:20px;font-weight:600;color:var(--green-300);margin-bottom:14px}
h1{font-weight:900;font-size:68px;line-height:1.02;letter-spacing:-.02em}
h1 span{color:var(--green-300)}
.sub{font-size:28px;color:#C7DAD1;margin-top:14px;max-width:60ch;line-height:1.35;min-height:38px}
.map{flex:1;display:flex;align-items:center;justify-content:center;margin-top:18px}
svg.m{width:1700px;height:auto;display:block;overflow:visible}
svg.m text{font-family:Roboto,'Helvetica Neue',Arial,sans-serif;font-size:16.5px;font-weight:700;fill:#fff}
svg.m text.s{font-family:'Roboto Mono',Menlo,monospace;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;fill:#A9C4B9}
svg.m text.w{font-size:21px;font-weight:900}
svg.m text.ws{font-size:14px;font-weight:500;fill:#D6E7DF}
svg.m text.k{font-size:19px;font-weight:900;fill:#04281E}
svg.m text.ks{font-size:12.5px;font-weight:600;fill:#0B3D2C}
svg.m text.lbl{font-family:'Roboto Mono',Menlo,monospace;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;fill:#8FB0A4}
svg.m text.lbl.o{fill:#F5B27A}
svg.m text.g{fill:var(--green-300);font-weight:700;font-size:13px}
svg.m text.head{font-family:'Roboto Mono',Menlo,monospace;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;fill:#6E9285}
.bx{fill:rgba(255,255,255,.055);stroke:rgba(255,255,255,.2);stroke-width:1.2}
.bx.core{fill:rgba(45,181,110,.16);stroke:var(--green);stroke-width:1.6}
.bx.go{stroke:var(--green-300)}
.bx.am{fill:rgba(245,130,32,.10);stroke:var(--orange)}
.bx.meet{fill:var(--green);stroke:var(--green)}
.bx.pill{fill:rgba(255,255,255,.05);stroke:var(--green-300);stroke-width:1.2}
.wire{fill:none;stroke:rgba(255,255,255,.42);stroke-width:1.8;marker-end:url(#ahd)}
.wire.g{stroke:var(--green)}
.wire.o{stroke:var(--orange)}
.wire.back{stroke:rgba(255,255,255,.35);stroke-dasharray:6 6}
.wire.bus{marker-end:none}
.nd,.wire,.lbl,.chipg{opacity:0}
.on{opacity:1}
svg.m .chip text{font-family:'Roboto Mono',Menlo,monospace;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.chip rect.ai{fill:var(--green)} .chip text.ai{fill:#04281E}
.chip rect.hu{fill:var(--orange)} .chip text.hu{fill:#2A1102}
.pulse{fill:var(--green-300)} .pulse2{fill:var(--green-300);opacity:.28}
.bar{position:absolute;left:110px;bottom:46px;width:210px;height:7px;background:var(--orange);border-radius:4px}
</style></head><body>

<h1>Every source, <span>one AI engine.</span></h1>
<div class="sub" id="sub">Six places we already look. One engine reads all of them.</div>

<div class="map">
<svg class="m" viewBox="0 0 1400 520" id="m">
  <defs><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(255,255,255,.55)"/></marker>

  <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F58220"/></marker></defs>

  <g class="nd src" data-k="4"><rect class="bx" x="20" y="287" width="250" height="62" rx="8"/><text x="38" y="313">Intent</text><text class="s" x="38" y="334">site visits, replies</text><path class="wire bus on" d="M270 318 L300 318"/></g>
  <g class="nd src" data-k="5"><rect class="bx" x="20" y="365" width="250" height="62" rx="8"/><text x="38" y="391">Market signals</text><text class="s" x="38" y="412">cost mandates, new leaders</text><path class="wire bus on" d="M270 396 L300 396"/></g>

    <text class="w" x="364" y="196">The AI engine</text>
    <text class="ws" x="364" y="226">reads every source, scores and routes</text>

  <path id="pp" fill="none" stroke="none" d="M270 84 L300 84 L300 240 L340 240 L480 240 L480 200 L620 200 L680 200 L680 166 L720 166 L980 166 L1090 166 L1205 166 L1205 210 L1205 270 L1205 360 L1205 470 L480 470 L480 332"/>

</div><div class="bar"></div>
<script>
const q=new URLSearchParams(location.search);
const k=+(q.get('k')||0), p=q.has('p')?+q.get('p'):null;
document.querySelectorAll('[data-k]').forEach(e=>{ if(k>=+e.dataset.k) e.classList.add('on'); });
const subs={0:'Five places we already look. One AI reads all of them.',
            6:'Every list goes through the same AI engine.',
            7:'The AI takes current customers out before anything moves.',
            8:'Cleared names get an AI-written sequence. Customers wait for the account manager.',
            9:'A reply becomes a meeting, and a row in Salesforce.',
            10:'Every two weeks we read the numbers and adjust the next wave.'};
let st=subs[0]; for(const kk of Object.keys(subs).map(Number).sort((a,b)=>a-b)) if(k>=kk) st=subs[kk];
document.getElementById('sub').textContent=st;
if(p!==null){
  const path=document.getElementById('pp'), L=path.getTotalLength(), pt=path.getPointAtLength(Math.max(0,Math.min(1,p))*L);
  const d=document.getElementById('dot'); d.style.display='';
  d.querySelectorAll('circle').forEach(c=>{c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);});
}
</script></body></html>
