<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GTM Control Tower</title>
  <style>
    :root { color-scheme: light; --bg:#f5f2ff; --panel:#fff; --ink:#221d33; --muted:#6c6583; --accent:#5b4bff; --accent2:#7f71ff; --amber:#d98a00; --green:#1f7a45; --gray:#7d7a8a; --border:#e7deff; }
    body { margin:0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; box-shadow:0 10px 28px rgba(44,41,71,0.06); padding:18px 20px; margin-bottom:18px; }
    .header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
    .title { font-size:24px; font-weight:700; margin:0 0 6px; }
    .sub { color:var(--muted); margin:0; }
    .gates { display:flex; gap:10px; flex-wrap:wrap; }
    .pill { padding:7px 11px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; }
    .pill.green { background:#e8f8ee; color:var(--green); }
    .pill.amber { background:#fff2db; color:var(--amber); }
    .pill.red { background:#fde9e8; color:#b33b34; }
    .pill.gray { background:#f1eef8; color:var(--gray); }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:16px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { padding:10px 8px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
    th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; }
    .badge { display:inline-block; padding:3px 8px; border-radius:999px; font-size:11px; font-weight:700; text-transform:uppercase; margin-left:6px; }
    .badge.seeded { background:#f1eef8; color:var(--gray); }
    .badge.live { background:#e8f8ee; color:var(--green); }
    .badge.stale { background:#fff2db; color:var(--amber); }
    .badge.realized { background:#e8f8ee; color:var(--green); }
    .muted { color:var(--muted); font-size:12px; }
    .kpi { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
    .kpi:last-child { border-bottom:none; }
    .small { font-size:12px; color:var(--muted); }
    .bullet { margin:0 0 8px 0; padding-left:16px; }
    .tag { display:inline-block; margin-top:6px; padding:3px 8px; border-radius:999px; background:#f1eef8; color:var(--gray); font-size:11px; }
    .metric { font-weight:700; } 
  </style>
</head>
<body>
  <div class="wrap">
    <div id="app"></div>
  </div>
  <script>
    async function loadState() {
      const response = await fetch('./control_tower_state.json');
      if (!response.ok) throw new Error('Unable to load control_tower_state.json');
      return response.json();
    }

    function badgeFor(status) {
      const cls = String(status || '').toLowerCase();
      if (cls.includes('seed')) return 'seeded';
      if (cls.includes('stale')) return 'stale';
      if (cls.includes('real')) return 'realized';
      return 'live';
    }

    function badgeLabel(status) {
      if (!status) return 'LIVE';
      return String(status).toUpperCase();
    }

    function render(state) {
      const app = document.getElementById('app');
      const header = document.createElement('div');
      header.className = 'card';
      header.innerHTML = `
        <div class="header">
          <div>
            <h1 class="title">GTM Control Tower</h1>
            <p class="sub">${state.overall.headline}</p>
          </div>
          <div class="gates">
            <div class="pill ${state.overall.gates.deliverability.toLowerCase() === 'green' ? 'green' : state.overall.gates.deliverability.toLowerCase() === 'amber' ? 'amber' : state.overall.gates.deliverability.toLowerCase() === 'red' ? 'red' : 'gray'}">Deliverability ${state.overall.gates.deliverability}</div>
            <div class="pill ${state.overall.gates.credit_budget.toLowerCase() === 'green' ? 'green' : state.overall.gates.credit_budget.toLowerCase() === 'amber' ? 'amber' : 'red'}">Credits ${state.overall.gates.credit_budget}</div>
            <div class="pill ${state.overall.gates.baseline_ratified ? 'green' : 'red'}">Baseline ${state.overall.gates.baseline_ratified ? 'Ratified' : 'Pending'}</div>
          </div>
        </div>
      `;
      app.appendChild(header);

      const motionCard = document.createElement('div');
      motionCard.className = 'card';
      motionCard.innerHTML = '<h2 style="margin-top:0">Motion Board</h2>';
      const table = document.createElement('table');
      table.innerHTML = `
        <thead><tr><th>Motion</th><th>Build</th><th>Universe</th><th>Contacts</th><th>Funnel</th><th>Next action</th><th>Blockers</th></tr></thead>
        <tbody></tbody>
      `;
      const tbody = table.querySelector('tbody');
      state.motions.forEach((motion) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${motion.label}</td>
          <td>${motion.build_state}</td>
          <td>${motion.universe} <span class="badge ${badgeFor(motion.universe_trust)}">${badgeLabel(motion.universe_trust)}</span></td>
          <td>${motion.contacts}</td>
          <td>${motion.funnel.sent}/${motion.funnel.delivered}/${motion.funnel.replies}/${motion.funnel.qualified_replies}/${motion.funnel.meetings_booked} <span class="badge ${badgeFor(motion.funnel_trust)}">${badgeLabel(motion.funnel_trust)}</span></td>
          <td>${motion.next_action}</td>
          <td>${(motion.blockers || []).join(' · ') || '—'}</td>
        `;
        tbody.appendChild(row);
      });
      motionCard.appendChild(table);
      app.appendChild(motionCard);

      const lower = document.createElement('div');
      lower.className = 'grid';

      const budgetCard = document.createElement('div');
      budgetCard.className = 'card';
      budgetCard.innerHTML = `
        <h3 style="margin-top:0">Credit Budget</h3>
        <div class="kpi"><span>Spent</span><span class="metric">${state.credits.spent}</span></div>
        <div class="kpi"><span>Remaining</span><span class="metric">${state.credits.remaining}</span></div>
        <div class="kpi"><span>Budget</span><span class="metric">${state.credits.budget}</span></div>
        <div class="kpi"><span>% consumed</span><span class="metric">${Math.round(state.credits.pct_consumed * 100)}%</span></div>
        <div class="kpi"><span>Cost / qualified reply</span><span class="metric">${state.credits.cost_per_qualified_reply ?? 'awaiting outcomes'}</span></div>
        <div class="small">Trust: ${state.credits.trust}</div>
      `;
      lower.appendChild(budgetCard);

      const deliverabilityCard = document.createElement('div');
      deliverabilityCard.className = 'card';
      deliverabilityCard.innerHTML = `
        <h3 style="margin-top:0">Deliverability Gate</h3>
        <div class="kpi"><span>Overall</span><span class="metric">${state.deliverability.overall}</span></div>
        <div class="kpi"><span>Last checked</span><span class="metric">${state.deliverability.last_checked || '—'}</span></div>
        <div class="kpi"><span>Trust</span><span class="metric">${state.deliverability.trust}</span></div>
        <div class="small">Floor: min open ${state.deliverability.floor.min_open_rate ?? '—'} · max spam ${state.deliverability.floor.max_spam_rate ?? '—'} · max bounce ${state.deliverability.floor.max_bounce_rate ?? '—'}</div>
      `;
      lower.appendChild(deliverabilityCard);

      const blockersCard = document.createElement('div');
      blockersCard.className = 'card';
      blockersCard.innerHTML = '<h3 style="margin-top:0">Blockers & Asks</h3>';
      const ul = document.createElement('ul');
      state.blockers_and_asks.forEach((item) => {
        const li = document.createElement('li');
        li.className = 'bullet';
        const label = item.type === 'blocker' ? (item.open ? 'blocker · OPEN' : 'blocker') : item.type;
        li.innerHTML = `<strong>${label}</strong> · ${item.source}<br>${item.text}`;
        ul.appendChild(li);
      });
      blockersCard.appendChild(ul);
      lower.appendChild(blockersCard);

      app.appendChild(lower);

      const sourcesCard = document.createElement('div');
      sourcesCard.className = 'card';
      sourcesCard.innerHTML = '<h3 style="margin-top:0">Source Trust</h3>';
      const sourceList = document.createElement('ul');
      state.sources.forEach((source) => {
        const li = document.createElement('li');
        li.className = 'bullet';
        li.innerHTML = `<strong>${source.name}</strong> · ${source.last_updated || '—'} · <span class="badge ${badgeFor(source.status)}">${badgeLabel(source.status)}</span> · stale=${source.stale}`;
        sourceList.appendChild(li);
      });
      sourcesCard.appendChild(sourceList);
      app.appendChild(sourcesCard);
    }

    loadState().then(render).catch((err) => {
      document.getElementById('app').innerHTML = `<div class="card"><h2>Unable to render</h2><p>${err.message}</p></div>`;
    });
  </script>
</body>
</html>
