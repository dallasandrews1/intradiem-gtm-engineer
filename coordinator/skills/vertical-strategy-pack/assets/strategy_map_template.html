<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}} — Meeting Strategy Map</title>
<style>
  :root{
    --navy:#1F3864; --t1:#1e8e5a; --t1bg:#e8f7ef; --t2:#b07d1e; --t2bg:#fdf6e3;
    --t3:#6b7280; --t3bg:#f3f4f6; --ink:#1a2233; --muted:#5b6577; --line:#e3e7ee;
    --hot:#d64545;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#f7f8fb;padding:28px 32px 60px}
  header{margin-bottom:22px}
  h1{font-size:24px;color:var(--navy);letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:13.5px;margin-top:4px}

  .reframe{background:var(--navy);color:#fff;border-radius:12px;padding:18px 22px;margin:18px 0 26px;display:flex;gap:18px;align-items:flex-start}
  .reframe .big{font-size:26px;line-height:1}
  .reframe h2{font-size:15px;margin-bottom:4px}
  .reframe p{font-size:13px;line-height:1.5;color:#d6ddeb}
  .reframe b{color:#fff}

  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 18px;min-width:130px}
  .stat .n{font-size:22px;font-weight:700}
  .stat .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
  .stat.s1 .n{color:var(--t1)} .stat.s2 .n{color:var(--t2)} .stat.s3 .n{color:var(--t3)} .stat.s4 .n{color:var(--hot)}

  .tier{margin-bottom:30px}
  .tier-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .tier-head h2{font-size:17px}
  .tier-head .tag{font-size:12px;color:var(--muted)}
  .t1c h2{color:var(--t1)} .t2c h2{color:var(--t2)} .t3c h2{color:var(--t3)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .card.t1{border-top:4px solid var(--t1)} .card.t2{border-top:4px solid var(--t2)} .card.t3{border-top:4px solid #c3c8d1}
  .card-top{padding:14px 16px 10px;cursor:pointer}
  .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .name{font-size:15.5px;font-weight:700}
  .badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .b-now{background:#fdecec;color:var(--hot)}
  .b-q3{background:#fdf6e3;color:var(--t2)}
  .b-nurture{background:#eef1f5;color:var(--t3)}
  .b-warm{background:#e8f7ef;color:var(--t1)}
  .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .signal{font-size:12.5px;line-height:1.45;margin-top:8px}
  .signal b{color:var(--navy)}
  .chev{color:#98a1b2;font-size:11px;margin-top:8px}
  .detail{display:none;border-top:1px dashed var(--line);padding:12px 16px 14px;font-size:12.5px;line-height:1.5}
  .card.open .detail{display:block}
  .detail .lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:8px 0 2px}
  .detail .lbl:first-child{margin-top:0}
  .hook{background:#f4f6fa;border-left:3px solid var(--navy);padding:8px 10px;border-radius:0 6px 6px 0;font-style:italic;color:#2c3a55}
  .warmnote{color:var(--t1);font-weight:600}

  .plays{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-top:6px}
  .plays h2{font-size:16px;color:var(--navy);margin-bottom:12px}
  .playgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .play{font-size:12.5px;line-height:1.5}
  .play h3{font-size:13px;margin-bottom:3px;color:var(--ink)}
  .play h3 span{margin-right:6px}
  footer{margin-top:24px;font-size:11.5px;color:var(--muted)}
  @media print{.detail{display:block}.chev{display:none}}
</style>
</head>
<body>
<header>
  <h1>{{TITLE}} — Meeting-Booking Strategy Map</h1>
  <div class="sub">{{SUBTITLE}}</div>
</header>

<div class="reframe">
  <div class="big">&#9889;</div>
  <div>
    <h2>{{REFRAME_HEADING}}</h2>
    <p>{{REFRAME_TEXT}}</p>
  </div>
</div>

<div class="stats">
{{STATS}}
</div>

{{TIERS}}

<div class="plays">
  <h2>Cross-account playbook</h2>
  <div class="playgrid">
{{PLAYBOOK}}
  </div>
</div>

<footer>{{FOOTER}}</footer>
</body>
</html>
